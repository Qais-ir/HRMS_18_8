
<div class="container-fluid">

    <div class="card">
        <div class="card-header">
            <h5>Filter</h5>
        </div>
        <div class="card-body">
            <div class="row">
                <!-- 12 col -->
                <div class="col-lg-4 col-md-4 col-sm-12">
                    <label for="name"
                        class="form-label">Name</label>
                    <input type="text" class="form-control"
                        id="name"
                        placeholder="Employee Name">
                </div>
                <div class="col-lg-4 col-md-4 col-sm-12">
                    <label for="position"
                        class="form-label">Position</label>
                    <input type="text" class="form-control"
                        id="position"
                        placeholder="Employee Position">
                </div>
                <div class="col-lg-4 col-md-4 col-sm-12">
                    <label for="status"
                        class="form-label">Status</label>
                    <input type="text" class="form-control"
                        id="status"
                        placeholder="Employee Status">
                </div>
            </div>

            <div class="mt-2 text-end">
                <button type="button" class="btn btn-secondary">Search</button>

            </div>
        </div>
    </div>

    <div class="card mt-2">
        <div class="card-header card-table-header">
            <h5>Employees</h5>

            <div>
                <button type="button" class="btn btn-secondary">Add Employee</button>

            </div>
        </div>
        <div class="card-body">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">First</th>
                        <th scope="col">Last</th>
                        <th scope="col">Handle</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="row">1</th>
                        <td>Mark</td>
                        <td>Otto</td>
                        <td>@mdo</td>
                    </tr>
                    <tr>
                        <th scope="row">2</th>
                        <td>Jacob</td>
                        <td>Thornton</td>
                        <td>@fat</td>
                    </tr>
                    <tr>
                        <th scope="row">3</th>
                        <td>John</td>
                        <td>Doe</td>
                        <td>@social</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
